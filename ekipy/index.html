function tbStrike(s,i,j,as){

    push({s,i,j,d:Math.round(d),c:crit,miss:false,dead,msg});

}

  const my=me.pts||1000,ex=1/(1+Math.pow(10,((o.pvp.pts||1000)-my)/400));
  const dl=Math.max(1,Math.min(50,Math.round(Math.abs(24*((win?1:0)-ex)))));
  const np=Math.max(0,my+(win?dl:-dl));
  PV.db.doc("pvp_players/"+PV.uid).update({pts:np,w:(me.w||0)+(win?1:0),l:(me.l||0)+(win?0:1)}).catch(()=>{});
  PV.db.collection("pvp_fights").add({a:PV.uid,an:S.name,d:o.pvp.id,win:!!win,dl,ts:Date.now()}).catch(()=>{});
  return `Ranking PvP: ${win?"+":"−"}${dl} pkt.`;
}
function pvpView(){

  const me=pvMe(),all=[...PV.list].sort((a,b)=>(b.pts||0)-(a.pts||0));

  if(rp.length)h+=`<h3>Ostatnie ataki na Ciebie</h3>`+rp.map(r=>`<div class="card"><span>${esc(r.an||"Gracz")} ${r.win?"pokonał Twoją drużynę":"przegrał z Twoją drużyną"} <b>(${r.win?"−":"+"}${Math.min(50,Math.abs(+r.dl||0))} pkt)</b></span></div>`).join("");

function pwrIdx(){const L=S.crew.filter(m=>!hurt(m)),A=L.length?L:S.crew;if(!A.length)return{a:1,h:1};
  const r=A.reduce((t,m)=>{const q=st(m,club());t.a+=q.a/CLS[m.cls].a;t.h+=q.h/CLS[m.cls].h;return t},{a:0,h:0});return{a:r.a/A.length,h:r.h/A.length}}
function pveEnemies(o,lv){
  const P=pwrIdx(),df=1+.12*(o.d||0),L=S.crew.filter(m=>!hurt(m)),A=L.length?L:S.crew;
  const art={};AK.forEach(a=>{art[a]=A.reduce((t,m)=>t+((m.ar||{})[a]||0),0)/Math.max(1,A.length)});
  return Object.keys(CLS).map(c=>{const m=mem(c,lv),v=R(.95,1.05);
    AK.forEach(a=>{const x=art[a]+(o.d||0)*.5+R(-.6,.6);m.ar[a]=Math.max(0,Math.min(5,Math.round(x)))});
    return{a:CLS[c].a*P.a*df*v,h:CLS[c].h*P.h*df*v,cls:c,ar:m.ar,name:m.name,perk:null,lvl:lv,ab:Math.random()*3|0}})}

function sim(A,B){
  const T=[A,B].map(X=>X.map(m=>({...m,hp:m.h,mx:m.h})));
  const alive=s=>T[s].map((u,i)=>i).filter(i=>T[s][i].hp>0);
  const snap=()=>T.map(X=>X.map(u=>u.hp));
  const ev=[];
  for(let r=1;r<=8&&alive(0).length&&alive(1).length;r++){
    const order=[];
    [0,1].forEach(s=>alive(s).forEach(i=>order.push([s,i])));
    order.sort((x,y)=>(T[y[0]][y[1]].cls==="Czujka")-(T[x[0]][x[1]].cls==="Czujka")||Math.random()-.5);
    for(const[s,i]of order){
      const u=T[s][i];
      if(u.hp<=0)continue;
      const en=alive(1-s);
      if(!en.length)break;
      const j=u.cls==='Bojówkarz'?en.slice().sort((a,b)=>T[1-s][a].hp-T[1-s][b].hp)[0]:pick(en),t=T[1-s][j];
      const miss=Math.random()<.03*(t.ar.capo||0);
      let d=miss?0:u.a*R(.8,1.2)*(T[s].some(x=>x.cls==='Gniazdowy'&&x.hp>0)?1.06:1)*(1+.04*(u.ar.muay||0))*(1-.03*(t.ar.judo||0)),c=false;
      if(!miss&&Math.random()<(u.cls==="Czujka"?.2:0)+.04*(u.ar.boks||0)){d*=1.5;c=true}
      t.hp=Math.max(0,t.hp-d);
      const e={s,i,j,d:Math.round(d),c,miss,dead:t.hp<=0};
      e.hp=snap();
      ev.push(e);
    }
  }
  const sum=s=>T[s].reduce((x,u)=>x+u.hp,0),mx=s=>T[s].reduce((x,u)=>x+u.mx,0);
  return{ev,mx:T.map(X=>X.map(u=>u.mx)),ma:mx(0),mb:mx(1),win:sum(0)/mx(0)>sum(1)/mx(1)};
}

["🧍 Postacie",["Prowodyr: zbalansowany przywódca, wzmacnia ekipę.","Stary Wyga: najwięcej zdrowia, przyjmuje ciosy na siebie.","Gniazdowy: wsparcie, leczy, rzuca racę.","Czujka: najszybszy (3 pola ruchu), częste ciosy krytyczne.","Bojówkarz: najmocniejszy atak, zasięg 2 pola, celuje w najsłabszych."]],
["⚔️ Walka",["Stuknij swojego zawodnika, potem rywala, i wybierz cios w kole. Możesz też najpierw przesunąć zawodnika na podświetlone pole.","Przycisk ✦ uruchamia umiejętność postaci. Aktywne działają co 3 rundy.","Ciosy: Mocny cios przebija Gard, Seria ciosów jest dobra na Unik, Finta omija Kontrę.","Przed turą rywala wybierasz postawę obronną: Gard, Unik, Kontra albo Napór.","Wygrywa ekipa, której ostatni zawodnik zostanie na nogach. Od 15. rundy dogrywka: ciosy są coraz mocniejsze.","Tryb auto: ekipa walczy sama. Możesz w każdej chwili przejąć sterowanie."]],
["🩹 Po walce",["Dostajesz monety, doświadczenie i szacunek.","Zawodnicy mogą odnieść kontuzję (częściej po porażce). Lekarz w ekipie zmniejsza tę szansę.","Kontuzja mija z czasem. Możesz ją skrócić apteczką albo wyleczyć od razu fiolkami.","Bardzo rzadko kontuzja kończy się śmiercią zawodnika."]],
["📈 Rozwój",["Ulepszaj zawodników i kupuj im sprzęt za monety.","W przejętych dzielnicach na mapie Miasta rozbudowuj budynki i trenuj zawodników (siła, kondycja, sztuki walki).","Członkowie z bonusem (★) wzmacniają całą ekipę. Bonus rozwijasz fiolkami testosteronu."]],
["🗺️ Terytoria",["Otwórz mapę Miasta (kafelek 🗺️ na stronie głównej), stuknij dzielnicę i zaatakuj jej ekipę. Wygrana daje kontrolę nad dzielnicą i odblokowuje jej budynek, np. pub, siłownię albo szpital. Rywale PvE zawsze dopasowują się do siły twojej ekipy.","Na koniec sezonu dzielnice wracają do rywali, ale poziomy budynków zostają."]],
["🌐 PvP i ranking",["W zakładce PvP zgłoś ekipę i wyzywaj prawdziwych graczy. Twoja zapisana ekipa broni się sama.","Do rankingu liczą się tylko walki PvP. Wygrane w PvP dają też awans do wyższej dywizji.","Sezon trwa 7 dni. Na koniec dostajesz nagrody za miejsce w rankingu PvP."]],
["📅 Codziennie",["Odbieraj nagrodę dzienną i wykonuj zadania dnia.","Raz dziennie zagraj derby o podwójne nagrody."]]]},
en:{t:"Game rules",b:"Back to settings",s:[
["🎯 Goal",["Build the strongest crew, take over your city and reach the top of the PvP ranking."]],
["👥 Crew",["5 fighters fight in the lineup, and you can keep 5 reserves on the bench.","The lineup can have at most 2 characters of the same class.","Each class has 3 skills. You pick one (ⓘ next to the fighter) and can change it before every fight."]],
["🧍 Characters",["Ringleader: balanced leader who boosts the crew.","Old Hand: the most health, takes hits for others.","Capo: support, heals, throws flares.","Lookout: the fastest (moves 3 tiles), frequent critical hits.","Enforcer: the strongest attack, reach of 2 tiles, targets the weakest."]],
["⚔️ Fighting",["Tap your fighter, then a rival, and choose a hit in the wheel. You can also move the fighter to a highlighted tile first.","The ✦ button uses the character's skill. Active skills work every 3 rounds.","Hits: Heavy blow pierces Guard, Flurry is good against Dodge, Feint bypasses Counter.","Before the rival's turn you choose a defensive stance: Guard, Dodge, Counter or Pressure.","The crew whose last fighter is still standing wins. From round 15 there is overtime: hits get stronger and stronger.","Auto mode: the crew fights on its own. You can take control at any time."]],
["🩹 After the fight",["You get coins, experience and respect.","Fighters can get injured (more often after a defeat). A Doctor in the crew lowers that chance.","Injuries heal over time. Shorten them with a medkit or heal at once with vials.","Very rarely an injury ends with the fighter's death."]],
["📈 Progress",["Upgrade fighters and buy them gear with coins.","In districts you hold on the City map, upgrade buildings and train fighters (strength, fitness, martial arts).","Members with a bonus (★) boost the whole crew. You grow the bonus with testosterone vials."]],
["🗺️ Territories",["Open the City map (🗺️ tile on the home screen), tap a district and attack its crew. A win gives you control of the district and unlocks its building, e.g. a pub, gym or hospital. PvE rivals always scale to your crew's strength.","At the end of the season districts go back to the rivals, but building levels stay."]],
["🌐 PvP and ranking",["In the PvP tab, enter your crew and challenge real players. Your saved crew defends itself.","Only PvP fights count for the ranking. PvP wins also promote you to higher divisions.","A season lasts 7 days. At the end you get rewards for your PvP ranking place."]],
["📅 Every day",["Claim the daily reward and complete the daily tasks.","Once a day play the derby for double rewards."]]]},
de:{t:"Spielregeln",b:"Zurück zu den Einstellungen",s:[
["🎯 Ziel",["Baue die stärkste Crew, erobere deine Stadt und erreiche die Spitze der PvP-Rangliste."]],
["👥 Crew",["5 Kämpfer kämpfen in der Aufstellung, 5 Ersatzspieler kannst du auf der Bank haben.","In der Aufstellung dürfen höchstens 2 Figuren derselben Klasse sein.","Jede Klasse hat 3 Fähigkeiten. Du wählst eine (ⓘ beim Kämpfer) und kannst sie vor jedem Kampf ändern."]],
["🧍 Figuren",["Rädelsführer: ausgewogener Anführer, stärkt die Crew.","Alter Hase: am meisten Gesundheit, steckt Treffer ein.","Capo: Unterstützung, heilt, wirft Bengalos.","Späher: der Schnellste (3 Felder), häufige kritische Treffer.","Schläger: stärkster Angriff, Reichweite 2 Felder, greift die Schwächsten an."]],
["⚔️ Kampf",["Tippe deinen Kämpfer, dann einen Gegner, und wähle im Rad einen Schlag. Du kannst den Kämpfer vorher auf ein markiertes Feld ziehen.","Die Taste ✦ nutzt die Fähigkeit der Figur. Aktive Fähigkeiten wirken alle 3 Runden.","Schläge: Harter Schlag durchbricht die Deckung, Schlagserie hilft gegen Ausweichen, Finte umgeht den Konter.","Vor dem Zug des Gegners wählst du eine Abwehrhaltung: Deckung, Ausweichen, Konter oder Druck.","Es gewinnt die Crew, deren letzter Kämpfer noch steht. Ab Runde 15 gibt es Verlängerung: Treffer werden immer stärker.","Auto-Modus: die Crew kämpft selbst. Du kannst jederzeit übernehmen."]],
["🩹 Nach dem Kampf",["Du bekommst Münzen, Erfahrung und Respekt.","Kämpfer können sich verletzen (öfter nach Niederlagen). Ein Arzt in der Crew senkt das Risiko.","Verletzungen heilen mit der Zeit. Verkürze sie mit einem Verbandskasten oder heile sofort mit Fläschchen.","Sehr selten endet eine Verletzung mit dem Tod des Kämpfers."]],
["📈 Fortschritt",["Verbessere Kämpfer und kaufe ihnen Ausrüstung mit Münzen.","In eroberten Vierteln auf der Stadtkarte baust du Gebäude aus und trainierst Kämpfer (Kraft, Kondition, Kampfsport).","Mitglieder mit Bonus (★) stärken die ganze Crew. Den Bonus steigerst du mit Testosteron-Fläschchen."]],
["🗺️ Gebiete",["Öffne die Stadtkarte (🗺️ auf dem Startbildschirm), tippe ein Viertel an und greife seine Crew an. Ein Sieg gibt dir das Viertel und schaltet sein Gebäude frei, z. B. Kneipe, Fitnessstudio oder Krankenhaus. PvE-Gegner passen sich immer der Stärke deiner Crew an.","Am Saisonende fallen die Viertel an die Gegner zurück, die Gebäudestufen bleiben."]],
["🌐 PvP und Rangliste",["Melde im PvP-Tab deine Crew an und fordere echte Spieler heraus. Deine gespeicherte Crew verteidigt sich selbst.","Nur PvP-Kämpfe zählen für die Rangliste. PvP-Siege bringen dich auch in höhere Divisionen.","Eine Saison dauert 7 Tage. Am Ende gibt es Belohnungen für deinen PvP-Platz."]],
["📅 Jeden Tag",["Hol dir die Tagesbelohnung und erledige die Tagesaufgaben.","Spiele einmal täglich das Derby für doppelte Belohnungen."]]]},
es:{t:"Reglas del juego",b:"Volver a ajustes",s:[
["🎯 Objetivo",["Forma la banda más fuerte, conquista tu ciudad y llega a lo más alto de la clasificación PvP."]],
["👥 Banda",["En la alineación pelean 5 luchadores y en el banquillo puedes tener 5 suplentes.","La alineación admite como máximo 2 personajes de la misma clase.","Cada clase tiene 3 habilidades. Eliges una (ⓘ junto al luchador) y puedes cambiarla antes de cada pelea."]],
["🧍 Personajes",["Cabecilla: líder equilibrado que refuerza a la banda.","Perro viejo: la mayor salud, recibe los golpes por los demás.","Capo: apoyo, cura y lanza bengalas.","Vigía: el más rápido (3 casillas), golpes críticos frecuentes.","Matón: el ataque más fuerte, alcance de 2 casillas, va a por los más débiles."]],
["⚔️ Pelea",["Toca a tu luchador, luego a un rival, y elige un golpe en la rueda. También puedes mover antes al luchador a una casilla resaltada.","El botón ✦ usa la habilidad del personaje. Las activas funcionan cada 3 rondas.","Golpes: el Golpe fuerte rompe la Guardia, la Ráfaga va bien contra la Esquiva y la Finta evita el Contraataque.","Antes del turno rival eliges una postura defensiva: Guardia, Esquiva, Contraataque o Presión.","Gana la banda cuyo último luchador siga en pie. Desde la ronda 15 hay prórroga: los golpes son cada vez más fuertes.","Modo auto: la banda pelea sola. Puedes tomar el control en cualquier momento."]],
["🩹 Tras la pelea",["Recibes monedas, experiencia y respeto.","Los luchadores pueden lesionarse (más a menudo tras una derrota). Un Médico en la banda reduce esa probabilidad.","Las lesiones se curan con el tiempo. Acórtalas con un botiquín o cúralas al instante con frascos.","Muy raramente una lesión acaba con la muerte del luchador."]],
["📈 Progreso",["Mejora a tus luchadores y cómprales equipo con monedas.","En los barrios conquistados del mapa mejora edificios y entrena a los luchadores (fuerza, forma física, artes marciales).","Los miembros con bonus (★) refuerzan a toda la banda. El bonus se mejora con frascos de testosterona."]],
["🗺️ Territorios",["Abre el mapa de la Ciudad (🗺️ en la pantalla de inicio), toca un barrio y ataca a su banda. Ganar te da el control del barrio y desbloquea su edificio, p. ej. bar, gimnasio u hospital. Los rivales PvE siempre se ajustan a la fuerza de tu banda.","Al final de la temporada los barrios vuelven a los rivales, pero los niveles de los edificios se mantienen."]],
["🌐 PvP y clasificación",["En la pestaña PvP inscribe tu banda y desafía a jugadores reales. Tu banda guardada se defiende sola.","Solo las peleas PvP cuentan para la clasificación. Las victorias PvP también te suben de división.","Una temporada dura 7 días. Al final recibes premios según tu puesto PvP."]],
["📅 Cada día",["Recoge la recompensa diaria y completa las tareas del día.","Una vez al día juega el derbi con recompensas dobles."]]]},
zh:{t:"游戏规则",b:"返回设置",s:[
["🎯 目标",["打造最强帮派，占领你的城市，冲上 PvP 排行榜首。"]],
["👥 帮派",["首发 5 名队员参战，替补席最多可放 5 名替补。","首发中同一职业最多 2 人。","每个职业有 3 个技能，选择其中一个（点队员旁的 ⓘ），每场战斗前都可更换。"]],
["🧍 角色",["头目：均衡的领袖，强化全帮派。","老江湖：生命最高，替队友扛伤害。","助威头：辅助、治疗、投掷火炬。","放哨的：速度最快（移动 3 格），暴击频繁。","打手：攻击最强，射程 2 格，专打最弱的对手。"]],
["⚔️ 战斗",["先点你的队员，再点对手，然后在轮盘中选择招式。也可以先把队员移到高亮格子。","✦ 按钮使用角色技能。主动技能每 3 回合可用一次。","招式克制：重击破格挡，连击克闪避，佯攻绕过反击。","对手回合前选择防守姿态：格挡、闪避、反击或压迫。","最后仍站着队员的帮派获胜。从第 15 回合开始进入加时：伤害越来越高。","自动模式：帮派自动战斗，你可以随时接管。"]],
["🩹 战斗之后",["获得金币、经验和声望。","队员可能受伤（失败后更常见）。帮派中的医生可降低受伤几率。","伤病会随时间恢复，可用医疗包缩短，或用药剂立即治愈。","极少数情况下，伤病会导致队员死亡。"]],
["📈 成长",["用金币升级队员、购买装备。","在城市地图上已占领的街区升级建筑并训练队员（力量、体能、格斗术）。","带加成（★）的成员能强化全帮派，加成可用睾酮药剂提升。"]],
["🗺️ 地盘",["打开城市地图（主页上的 🗺️），点击街区并进攻其帮派。获胜即可掌控该街区并解锁其建筑，例如酒吧、健身房或医院。PvE 对手总会根据你帮派的实力调整。","赛季结束时街区会回到对手手中，但建筑等级保留。"]],
["🌐 PvP 与排行",["在 PvP 页报名帮派并挑战真实玩家。你保存的帮派会自动防守。","只有 PvP 战斗计入排行。PvP 胜利还能让你晋级更高的段位。","每个赛季 7 天，结束时按 PvP 排名发放奖励。"]],
["📅 每日",["领取每日奖励并完成每日任务。","每天可打一场德比，奖励翻倍。"]]]},
ko:{t:"게임 규칙",b:"설정으로 돌아가기",s:[
["🎯 목표",["가장 강한 크루를 만들고, 도시를 장악하고, PvP 랭킹 정상에 오르세요."]],
["👥 크루",["라인업 5명이 싸우고, 벤치에는 후보 5명까지 둘 수 있습니다.","라인업에는 같은 클래스가 최대 2명까지 가능합니다.","클래스마다 기술이 3개 있습니다. 하나를 고르고(멤버 옆 ⓘ) 전투 전마다 바꿀 수 있습니다."]],
["🧍 캐릭터",["두목: 균형 잡힌 리더, 크루를 강화합니다.","노련한 형님: 체력이 가장 높고 공격을 대신 받아냅니다.","응원단장: 지원, 치료, 홍염 투척.","망보는 놈: 가장 빠름(3칸 이동), 잦은 치명타.","행동대원: 가장 강한 공격, 사거리 2칸, 약한 상대를 노립니다."]],
["⚔️ 전투",["내 멤버, 상대 순으로 탭하고 휠에서 공격을 고르세요. 먼저 강조된 칸으로 멤버를 옮길 수도 있습니다.","✦ 버튼은 캐릭터 기술입니다. 액티브 기술은 3라운드마다 사용할 수 있습니다.","상성: 강타는 가드를 뚫고, 연타는 회피에 강하며, 페인트는 카운터를 피합니다.","상대 차례 전에 방어 자세를 고르세요: 가드, 회피, 카운터, 압박.","마지막 멤버가 서 있는 크루가 이깁니다. 15라운드부터 연장전: 피해가 점점 커집니다.","자동 모드: 크루가 알아서 싸웁니다. 언제든 직접 조작할 수 있습니다."]],
["🩹 전투 후",["코인, 경험치, 리스펙트를 얻습니다.","멤버가 부상당할 수 있습니다(패배 후 더 자주). 크루의 의사가 확률을 낮춥니다.","부상은 시간이 지나면 낫습니다. 구급상자로 줄이거나 약병으로 즉시 치료하세요.","아주 드물게 부상으로 멤버가 사망합니다."]],
["📈 성장",["코인으로 멤버를 강화하고 장비를 사세요.","도시 지도에서 차지한 구역의 건물을 강화하고 멤버를 훈련하세요(힘, 체력, 무술).","보너스(★) 멤버는 크루 전체를 강화합니다. 보너스는 테스토스테론 약병으로 올립니다."]],
["🗺️ 영역",["도시 지도(홈 화면의 🗺️)를 열고 구역을 탭해 그 크루를 공격하세요. 이기면 구역을 장악하고 펍, 체육관, 병원 같은 건물이 열립니다. PvE 상대는 항상 내 크루 실력에 맞춰집니다.","시즌이 끝나면 구역은 상대에게 돌아가지만 건물 레벨은 유지됩니다."]],
["🌐 PvP와 랭킹",["PvP 탭에서 크루를 등록하고 실제 플레이어에게 도전하세요. 저장된 크루는 자동으로 방어합니다.","랭킹에는 PvP 전투만 반영됩니다. PvP 승리로 상위 디비전에 승격합니다.","시즌은 7일입니다. 끝나면 PvP 순위에 따라 보상을 받습니다."]],
["📅 매일",["일일 보상을 받고 일일 미션을 완료하세요.","하루 한 번 더비를 플레이해 보상 2배를 받으세요."]]]},
ja:{t:"ゲームのルール",b:"設定に戻る",s:[
["🎯 目的",["最強のクルーを作り、街を支配し、PvP ランキングの頂点を目指そう。"]],
["👥 クルー",["スタメン5人が戦い、ベンチには控えを5人まで置けます。","スタメンには同じクラスを最大2人まで入れられます。","各クラスにスキルが3つあります。1つを選び（メンバー横の ⓘ）、バトル前ならいつでも変更できます。"]],
["🧍 キャラクター",["親分：バランス型のリーダー。クルーを強化。","古株：体力が最も高く、攻撃を引き受ける。","応援団長：サポート、回復、発煙筒。","見張り：最速（3マス移動）、クリティカルが多い。","武闘派：攻撃力最強、射程2マス、弱った相手を狙う。"]],
["⚔️ バトル",["自分のメンバー、相手の順にタップし、ホイールで攻撃を選択。先に光っているマスへ移動することもできます。","✦ ボタンでキャラのスキルを使用。アクティブスキルは3ラウンドごとに使えます。","相性：ヘビーブローはガードを貫き、ラッシュは回避に強く、フェイントはカウンターをかわす。","相手のターンの前に防御スタンスを選びます：ガード、回避、カウンター、プレッシャー。","最後のメンバーが立っていたクルーの勝ち。15ラウンド目から延長戦：攻撃がどんどん強くなります。","オートモード：クルーが自動で戦います。いつでも操作を引き継げます。"]],
["🩹 バトル後",["コイン、経験値、リスペクトを獲得。","メンバーがケガをすることがあります（負けた後は多め）。クルーに医者がいると確率が下がります。","ケガは時間で治ります。救急箱で短縮、または小瓶ですぐ治療できます。","ごくまれに、ケガでメンバーが死亡します。"]],
["📈 成長",["コインでメンバーを強化し、装備を買おう。","街のマップで奪った地区の建物を強化し、メンバーを鍛えよう（筋力、体力、格闘技）。","ボーナス（★）持ちのメンバーはクルー全体を強化。ボーナスはテストステロンの小瓶で上げます。"]],
["🗺️ 縄張り",["街のマップ（ホームの 🗺️）を開き、地区をタップしてそのクルーを攻めよう。勝てば地区を支配し、パブ・ジム・病院などの建物が解放されます。PvE の相手は常にクルーの強さに合わせて調整されます。","シーズン終了時に地区は相手に戻りますが、建物のレベルは残ります。"]],
["🌐 PvP とランキング",["PvP タブでクルーを登録し、本物のプレイヤーに挑戦しよう。保存したクルーは自動で防衛します。","ランキングに反映されるのは PvP バトルだけ。PvP の勝利で上のディビジョンに昇格します。","シーズンは7日間。終了時に PvP の順位に応じて報酬がもらえます。"]],
["📅 毎日",["デイリー報酬を受け取り、デイリーミッションをこなそう。","1日1回、報酬2倍のダービーをプレイしよう。"]]]}};

function tickJobs(){
  let ch=false;const n=Date.now();
  for(const k in S.bl){
    const b=S.bl[k];
    if(b.up&&b.up<=n){b.up=0;b.lv++;if(k==="shop"&&b.lv===1)b.last=n;ch=true}
    (b.tr||[]).forEach(j=>{if(!j.done&&j.end<=n){j.done=true;ch=true}});
  }

function applyTrain(refs){
  const out=[];
  for(const k in S.bl){
    const b=S.bl[k];if(!b.tr)continue;
    b.tr=b.tr.filter(j=>{
      const m=S.crew[j.i];
      if(!j.done||!refs.includes(m))return true;
      if(j.f==="ta")m.ta+=j.g;else if(j.f==="th")m.th+=j.g;else m.ar[j.f]=Math.min(5,(m.ar[j.f]||0)+j.g);
      out.push(m.name+": "+jobName(j)+" +"+j.g);
      return false;
    });
  }
  return out;
}

function train(k){
  const b=S.bl[k],s2=S.sel[k],m=S.crew[s2.i];
  if(!unl(k)||!b.lv||b.up||!m||b.tr.length>=SLOT(b.lv)||trainingNow(s2.i))return;
  const f=k==="gym"?"ta":k==="field"?"th":s2.f;
  if(k==="dojo"){const lv=m.ar[f]||0;if(lv>=5||lv>=b.lv)return}
  const c=jobCost(m,f);if(S.coins<c)return;
  S.coins-=c;

  render();
}

  let rg=(res.win?15+10*(o.d+1):4)+faN()+2*blv("pub")+Object.keys(S.terr).length+(S.opUsed==="banner"?6:0),ri0=rkI(S.rep||0);if(o.derby)rg*=2;S.rep=(S.rep||0)+rg;const ri1=rkI(S.rep);

const ARMB=[[19.9,15.2,2.35],[18.7,22.4,2.0],[19.4,28.8,1.55],[19.6,30.6,1.4]];
const ARMF=[[28.3,15.1,2.45],[30.2,22.3,2.1],[32.5,28.4,1.6],[33.5,30.2,1.45]];
function sleeve(sp,col,o){o=o||{};const m=mat(col,o.m);
  const e=at(sp,.5),sh=at(sp,.12);
  let inn=soft(e[0]-.9,e[1]+.2,1.8,1.2,.4)+soft(sh[0]-.2,sh[1]+2.4,2.4,1,.38)+soft(e[0]+.9,e[1]-1.8,1.2,2.2,.22,0,1);
  inn+=fold(`M${r2(e[0]-1.4)} ${r2(e[1]-.7)}L${r2(e[0]+.1)} ${r2(e[1]+.3)}L${r2(e[0]-1)} ${r2(e[1]+1)}`,m)+fold(`M${r2(e[0]-1.3)} ${r2(e[1]+1.5)}L${r2(e[0]+.3)} ${r2(e[1]+2.2)}`,m,.8)+fold(`M${r2(sh[0]+.6)} ${r2(sh[1]+2)}Q${r2(sh[0]+1.6)} ${r2(sh[1]+3)} ${r2(sh[0]+2)} ${r2(sh[1]+4.4)}`,m,.9);
  let s=limb(sp,m,{in:inn+(o.in||""),cap:true});
  if(o.back)s+=`<path d="${tube(sp)}" fill="#0a0812" opacity=".3"/>`;
  return s}

function clubScarf(col,c2,long){const m=mat(col),L=long?29.6:26.4,d1=`M22.6 11.6Q25 13.4 28.4 11.8L29.6 14.4Q25.2 17 21.8 14.6Z`;
  let s=`<path d="${d1}" fill="${grad(21.8,0,29.6,0,[[0,m.s],[.5,m.l],[1,m.b]])}"/>`+clip(d1,soft(25,15.6,4.6,1.3,.5)+[12.4,13.4,14.4].map((y,i)=>`<path d="M21.6 ${y+.5}Q25.4 ${y+2.5} 29.8 ${y+.3}" stroke="${c2}" stroke-width=".62" fill="none" opacity="${i==1?.95:.9}" transform="translate(0 ${-i*.1})"/>`).join(""))+edgeLn(d1,m,.22);
  const d2=`M26.4 14.8L${long?29.2:28.6} ${L}L${long?26.4:25.8} ${r2(L-.2)}L25 15.4Z`;
  s+=`<path d="${d2}" fill="${grad(25,0,29,0,[[0,m.s],[.5,m.l],[1,m.b]])}"/>`+clip(d2,Array.from({length:Math.floor((L-16)/2.2)+1},(_,i)=>{const y=16.6+i*2.2;return`<path d="M24.8 ${r2(y)}L${r2(29.4)} ${r2(y+.3)}" stroke="${c2}" stroke-width=".78"/>`}).join("")+soft(25.4,L-1,2,2.6,.35))+edgeLn(d2,m,.22);
  s+=[0,.8,1.6,2.4].map(d=>`<path d="M${r2((long?26.5:25.9)+d)} ${r2(L-.1)}V${r2(L+1.2)}" stroke="${mix(col,"#000",.25)}" stroke-width=".32"/>`).join("");
