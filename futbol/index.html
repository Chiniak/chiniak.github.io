<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futbol – prognozy meczów</title>
<meta name="description" content="Najważniejsze ligi piłkarskie i puchary europejskie: wyniki, tabele, forma, kontuzje i prognozy meczów.">
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Futbol</span><small>prognozy</small></div>
  <button id="refresh" class="icon-btn" aria-label="Odśwież dane" title="Odśwież dane">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.7 5.8l1.8-1.1.9 1.6-4 2.4-2.4-4 1.6-1 .4.7A6 6 0 1 0 18 12h2a8 8 0 1 1-8-8z"/></svg>
  </button>
</header>
<div id="notice" class="notice" hidden></div>
<main id="view" aria-live="polite"><div class="loading">Wczytuję dane…</div></main>

<nav class="tabs" role="tablist">
  <button data-tab="mecze" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>Mecze</button>
  <button data-tab="tabela"><svg viewBox="0 0 24 24"><path d="M3 4h18v4H3zm0 6h18v4H3zm0 6h18v4H3z" opacity=".9"/></svg>Tabela</button>
  <button data-tab="kluby"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg>Kluby</button>
  <button data-tab="typuj"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5l3 2.2-1.1 3.6h-3.8L10 9.2zM6.4 9.6l2.1.3 1.2 3.7-1.6 2.6-2.4-.6A8 8 0 0 1 4 12zm11.2 0A8 8 0 0 1 20 12a8 8 0 0 1-1.7 3.6l-2.4.6-1.6-2.6 1.2-3.7z"/></svg>Typuj</button>
  <button data-tab="typy"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>Moje typy</button>
  <button data-tab="dane"><svg viewBox="0 0 24 24"><path d="M12 3c4.4 0 8 1.3 8 3v12c0 1.7-3.6 3-8 3s-8-1.3-8-3V6c0-1.7 3.6-3 8-3zm0 2C8 5 6 6 6 6.2S8 7.5 12 7.5s6-1.1 6-1.3S16 5 12 5zm6 4.3c-1.5.7-3.6 1-6 1s-4.5-.3-6-1V12c0 .3 2 1.5 6 1.5s6-1.2 6-1.5z"/></svg>Dane</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button class="sheet-x icon-btn" data-close aria-label="Zamknij">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="model.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
